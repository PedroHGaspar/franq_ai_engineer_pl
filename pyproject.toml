[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "franq-data-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.4.6", "langgraph==1.2.16", "langchain-openai==1.7.2",
  "pydantic==2.14.1", "pydantic-settings==2.16.1", "streamlit==1.66.1",
  "sqlglot==30.24.0", "pandas==3.0.6", "plotly==7.1.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "httpx==0.28.1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["original: requer o banco original local"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
